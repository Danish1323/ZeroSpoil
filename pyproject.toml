[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "zerospoil"
version = "0.1.0"
description = "ZeroSpoil Backend Engine, Deterministic Safety Rails & Hyperlocal Rescue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "httpx>=0.27.0",
    "fpdf2>=2.8.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
